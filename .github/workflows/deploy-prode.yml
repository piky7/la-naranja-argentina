name: Desplegar API Prode LNA

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-prode
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4
      - name: Instalar Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Verificar sintaxis del Worker
        run: node --check workers/prode/worker.js
      - name: Aplicar esquema D1 de Prode
        run: npx --yes wrangler@4 d1 execute lna-prode --remote --config workers/prode/wrangler.toml --file database/prode/001_initial.sql
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Desplegar Worker Prode
        run: npx --yes wrangler@4 deploy --config workers/prode/wrangler.toml
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
