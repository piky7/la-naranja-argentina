name: Desplegar LIVE oficial LNA

on:
  push:
    branches: [main]
    paths:
      - "cloudflare-live-oficial/**"
      - ".github/workflows/deploy-live-oficial.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-live-oficial
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4
      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Validar sintaxis
        run: node --check cloudflare-live-oficial/worker.js
      - name: Publicar Worker oficial
        run: npx --yes wrangler@4 deploy --config cloudflare-live-oficial/wrangler.toml
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
