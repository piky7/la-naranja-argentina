name: Sincronización unificada LNB + LAB

on:
  # La programación automática queda centralizada en Cloudflare Worker lna-sync.
  # Se conservan los disparadores manuales y el backfill explícito.
  push:
    branches: [main]
    paths:
      - "data/lab/backfill-request.json"
  workflow_dispatch:
    inputs:
      mode:
        description: "Modo de sincronización"
        required: true
        type: choice
        options:
          - recent
          - full
          - backfill
        default: recent

env:
  OFFICIAL_SCHEDULE: "*/10 * * * *"
  LAB_SCHEDULE: "*/10 * * * *"

permissions:
  contents: write

concurrency:
  group: lna-publicacion-datos-main
  cancel-in-progress: false

jobs:
  sincronizar-lnb:
    if: github.event_name != 'push' && inputs.mode != 'backfill'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    outputs:
      run: ${{ steps.window.outputs.run }}
      mode: ${{ steps.window.outputs.mode }}
    env:
      OFFICIAL_REQUESTED_MODE: ${{ inputs.mode }}
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
      - name: Comprobar partidos pendientes
        id: window
        run: node scripts/official-poll-window.cjs
      - name: Configurar Node.js
        if: steps.window.outputs.run == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Instalar dependencias
        if: steps.window.outputs.run == 'true'
        run: npm ci
      - name: Consultar fixture oficial LNB
        if: steps.window.outputs.run == 'true'
        env:
          OFFICIAL_SYNC_MODE: ${{ steps.window.outputs.mode }}
        run: node discover-liga.cjs
      - name: Incorporar partidos oficiales nuevos
        if: steps.window.outputs.run == 'true'
        run: node merge-liga-events.cjs
      - name: Regenerar calendario oficial
        if: steps.window.outputs.run == 'true'
        run: node generate-official-schedule.cjs
      - name: Extraer estadísticas oficiales
        if: steps.window.outputs.run == 'true'
        env:
          OFFICIAL_SYNC_MODE: ${{ steps.window.outputs.mode }}
        run: node sync-liga-history.cjs
      - name: Incorporar jugadores de planillas oficiales
        if: steps.window.outputs.run == 'true'
        run: node scripts/sync-official-roster.cjs
      - name: Verificar sintaxis de jugadores
        if: steps.window.outputs.run == 'true'
        run: node --check src/data/players.js
      - name: Validar estadísticas oficiales
        if: steps.window.outputs.run == 'true'
        run: node sync-official-stats-preview.cjs
      - name: Preparar datos oficiales publicados
        if: steps.window.outputs.run == 'true'
        run: node publish-official-stats.cjs
      - name: Actualizar dorsales verificados
        if: steps.window.outputs.run == 'true'
        run: node scripts/update-player-numbers.cjs
      - name: Guardar datos LNB para publicación coordinada
        if: steps.window.outputs.run == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: datos-lnb
          path: |
            liga-events.json
            liga-history.json
            src/data/officialSchedule.js
            src/data/matchStats.js
            src/data/matchResults.js
            src/data/players.js
            public/published-matches.json
          if-no-files-found: error
          retention-days: 2
      - name: Guardar diagnóstico LNB
        if: always() && steps.window.outputs.run == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: diagnostico-lnb
          path: |
            official-sync-preview.json
            official-roster-review.json
            liga-events-preview.json
          if-no-files-found: ignore
          retention-days: 2

  sincronizar-lab:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    outputs:
      run: ${{ steps.window.outputs.run }}
      mode: ${{ steps.window.outputs.mode }}
    env:
      LAB_REQUESTED_MODE: ${{ github.event_name == 'push' && 'backfill' || inputs.mode }}
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
      - name: Comprobar partidos LAB pendientes
        id: window
        run: node scripts/lab-poll-window.cjs
      - name: Configurar Node.js
        if: steps.window.outputs.run == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Instalar dependencias
        if: steps.window.outputs.run == 'true'
        run: npm ci
      - name: Actualizar fixture oficial LAB
        if: steps.window.outputs.run == 'true' && steps.window.outputs.mode == 'full'
        run: |
          git show HEAD:data/lab/labSchedule.json > /tmp/labSchedule.before.json
          node scripts/sync-lab-fixture.cjs
          node --input-type=module -e '
            import fs from "node:fs";
            const before=JSON.parse(fs.readFileSync("/tmp/labSchedule.before.json","utf8"));
            const after=JSON.parse(fs.readFileSync("data/lab/labSchedule.json","utf8"));
            const unchanged=JSON.stringify(before.teams)===JSON.stringify(after.teams) &&
              JSON.stringify(before.matches)===JSON.stringify(after.matches);
            if (unchanged) fs.copyFileSync("/tmp/labSchedule.before.json","data/lab/labSchedule.json");
            console.log(unchanged ? "Fixture LAB sin cambios deportivos." : "Fixture LAB actualizado.");
          '
      - name: Importar boxscores LAB
        if: steps.window.outputs.run == 'true'
        run: |
          if [ -f data/lab/backfill-request.json ] && [ "$(node -p "JSON.parse(require('fs').readFileSync('data/lab/backfill-request.json','utf8')).allFinished === true")" = "true" ]; then
            node scripts/sync-lab-boxscores.cjs --all-finished
          elif [ -f data/lab/backfill-request.json ]; then
            MATCH_ID=$(node -p "JSON.parse(require('fs').readFileSync('data/lab/backfill-request.json','utf8')).matchId")
            node scripts/sync-lab-boxscores.cjs --match="$MATCH_ID"
          elif [ "${{ steps.window.outputs.mode }}" = "backfill" ]; then
            node scripts/sync-lab-boxscores.cjs --all-finished
          else
            node scripts/sync-lab-boxscores.cjs --recent
          fi
      - name: Consolidar resultados y planteles LAB
        if: steps.window.outputs.run == 'true'
        run: |
          node scripts/publish-lab-results.cjs
          # Regenerar siempre los planteles: el generador puede corregirse
          # aunque los boxscores no cambien (por ejemplo, para reparar PJ).
          node scripts/build-lab-rosters.cjs
          node --check scripts/sync-lab-boxscores.cjs
          node --check scripts/publish-lab-results.cjs
          node --check scripts/build-lab-rosters.cjs
      - name: Validar integridad de los datos LAB
        if: steps.window.outputs.run == 'true'
        run: |
          node --input-type=module -e '
            import fs from "node:fs";
            const fixture=JSON.parse(fs.readFileSync("data/lab/labSchedule.json","utf8"));
            const boxes=JSON.parse(fs.readFileSync("data/lab/labBoxscores.json","utf8"));
            const rosters=JSON.parse(fs.readFileSync("data/lab/labRosters.json","utf8"));
            const finals=fixture.matches.filter(m=>m.status==="finished");
            for (const match of finals) {
              const box=boxes[match.id];
              if (!box || box.status!=="finished" || !box.players?.length || !box.teamComparison?.home || !box.teamComparison?.away)
                throw new Error("Final LAB sin boxscore completo: "+match.id);
              if (Number(match.homeScore)!==Number(box.homeScore) || Number(match.awayScore)!==Number(box.awayScore))
                throw new Error("Marcador y boxscore no coinciden: "+match.id);
            }
            if (!Array.isArray(fixture.teams) || fixture.teams.length<30 || !rosters.teams)
              throw new Error("Fixture o planteles LAB incompletos.");
            console.log("LAB validada:",fixture.matches.length,"partidos;",finals.length,"finales con boxscore;",Object.keys(rosters.teams).length,"equipos.");
          '
      - name: Guardar datos LAB para publicación coordinada
        if: steps.window.outputs.run == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: datos-lab
          path: |
            data/lab/labSchedule.json
            data/lab/labBoxscores.json
            data/lab/labRosters.json
          if-no-files-found: error
          retention-days: 2

  publicar:
    needs: [sincronizar-lnb, sincronizar-lab]
    if: always() && (needs.sincronizar-lnb.outputs.run == 'true' || needs.sincronizar-lab.outputs.run == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Descargar main actualizado
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Descargar datos LNB
        if: needs.sincronizar-lnb.outputs.run == 'true'
        uses: actions/download-artifact@v4
        with:
          name: datos-lnb
          path: artefactos/lnb
      - name: Descargar datos LAB
        if: needs.sincronizar-lab.outputs.run == 'true'
        uses: actions/download-artifact@v4
        with:
          name: datos-lab
          path: artefactos/lab
      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Instalar dependencias
        run: npm ci
      - name: Integrar datos, compilar y publicar una sola vez
        env:
          PUBLICAR_LNB: ${{ needs.sincronizar-lnb.outputs.run }}
          PUBLICAR_LAB: ${{ needs.sincronizar-lab.outputs.run }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          aplicar_datos() {
            if [ "$PUBLICAR_LNB" = "true" ]; then
              for f in liga-events.json liga-history.json src/data/officialSchedule.js src/data/matchStats.js src/data/matchResults.js src/data/players.js public/published-matches.json; do
                mkdir -p "$(dirname "$f")"
                cp "artefactos/lnb/$f" "$f"
              done
            fi
            if [ "$PUBLICAR_LAB" = "true" ]; then
              for f in data/lab/labSchedule.json data/lab/labBoxscores.json data/lab/labRosters.json; do
                mkdir -p "$(dirname "$f")"
                cp "artefactos/lab/$(basename "$f")" "$f"
              done
            fi
          }

          for intento in 1 2 3; do
            git fetch origin main
            git reset --hard origin/main
            aplicar_datos
            npm run build
            git add liga-events.json liga-history.json src/data/officialSchedule.js src/data/matchStats.js src/data/matchResults.js src/data/players.js public/published-matches.json data/lab/labSchedule.json data/lab/labBoxscores.json data/lab/labRosters.json
            if git diff --cached --quiet; then
              echo "No hay datos nuevos para publicar."
              exit 0
            fi
            git commit -m "Actualizar sincronización oficial LNB y LAB"
            if git push origin HEAD:main; then
              echo "LNB y LAB publicadas en un único commit."
              exit 0
            fi
            echo "Push rechazado en intento $intento; se regenerará desde main."
          done
          echo "::error::No se pudo publicar después de tres intentos."
          exit 1
      - name: Resumen de publicación
        if: always()
        run: |
          {
            echo "## Sincronización unificada LNA"
            echo "- LNB: ${{ needs.sincronizar-lnb.outputs.run }}"
            echo "- LAB: ${{ needs.sincronizar-lab.outputs.run }}"
            echo "- Modo solicitado: ${{ github.event_name == 'push' && 'backfill' || inputs.mode }}"
            echo "- Publicación: un único commit coordinado"
          } >> "$GITHUB_STEP_SUMMARY"
