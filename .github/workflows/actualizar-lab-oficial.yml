name: Actualizar LAB desde la Liga Nacional

on:
  schedule:
    - cron: "*/10 * * * *"
    - cron: "0 */6 * * *"
    - cron: "30 6 * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "Modo de sincronización"
        required: false
        type: choice
        options:
          - recent
          - full
          - backfill
        default: full
  push:
    branches: [main]
    paths:
      - ".github/workflows/actualizar-lab-oficial.yml"
      - "scripts/lab-poll-window.cjs"
      - "scripts/sync-lab-boxscores.cjs"
      - "scripts/sync-lab-fixture.cjs"
      - "scripts/parse-fixture-lab.cjs"
      - "scripts/publish-lab-results.cjs"
      - "scripts/build-lab-rosters.cjs"
      - "tests/lab-sync.test.mjs"
      - "vite.config.js"

permissions:
  contents: write

concurrency:
  group: actualizar-lab-oficial-${{ github.ref }}
  cancel-in-progress: false

jobs:
  actualizar:
    runs-on: ubuntu-latest
    timeout-minutes: ${{ ((github.event_name == 'schedule' && github.event.schedule == '*/10 * * * *') || (github.event_name == 'workflow_dispatch' && inputs.mode == 'recent')) && 12 || (github.event_name == 'workflow_dispatch' && inputs.mode == 'backfill') && 45 || 30 }}
    env:
      LAB_SCHEDULE: ${{ github.event.schedule }}
      LAB_REQUESTED_MODE: ${{ inputs.mode }}

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Comprobar partidos pendientes antes de instalar dependencias
        id: window
        run: node scripts/lab-poll-window.cjs

      - name: Configurar Node.js
        if: steps.window.outputs.run == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependencias
        if: steps.window.outputs.run == 'true'
        run: npm ci

      - name: Actualizar fixture oficial LAB
        if: steps.window.outputs.run == 'true' && steps.window.outputs.mode != 'recent'
        run: |
          git show HEAD:data/lab/labSchedule.json > /tmp/labSchedule.before.json
          node scripts/sync-lab-fixture.cjs
          node --input-type=module -e '
            import fs from "node:fs";
            const before=JSON.parse(fs.readFileSync("/tmp/labSchedule.before.json","utf8"));
            const after=JSON.parse(fs.readFileSync("data/lab/labSchedule.json","utf8"));
            const unchanged=JSON.stringify(before.teams)===JSON.stringify(after.teams) &&
              JSON.stringify(before.matches)===JSON.stringify(after.matches);
            if (unchanged) fs.copyFileSync("/tmp/labSchedule.before.json","data/lab/labSchedule.json");
            console.log(unchanged ? "Fixture sin cambios deportivos." : "Fixture actualizado con cambios oficiales.");
          '

      - name: Importar boxscores oficiales pendientes
        if: steps.window.outputs.run == 'true'
        run: |
          if [ "${{ steps.window.outputs.mode }}" = "backfill" ]; then
            node scripts/sync-lab-boxscores.cjs --all-finished
          else
            node scripts/sync-lab-boxscores.cjs --recent
          fi

      - name: Publicar resultados finales y consolidar planteles
        if: steps.window.outputs.run == 'true'
        run: |
          node scripts/publish-lab-results.cjs
          if ! git diff --quiet -- data/lab/labBoxscores.json; then
            node scripts/build-lab-rosters.cjs
          fi
          node --check scripts/sync-lab-boxscores.cjs
          node --check scripts/publish-lab-results.cjs
          node --check scripts/build-lab-rosters.cjs

      - name: Validar resultados, estadísticas y tabla de posiciones
        if: steps.window.outputs.run == 'true'
        run: |
          node --input-type=module -e '
            import fs from "node:fs";
            const fixture=JSON.parse(fs.readFileSync("data/lab/labSchedule.json","utf8"));
            const boxes=JSON.parse(fs.readFileSync("data/lab/labBoxscores.json","utf8"));
            const rosters=JSON.parse(fs.readFileSync("data/lab/labRosters.json","utf8"));
            const finals=fixture.matches.filter(m=>m.status==="finished");
            for (const match of finals) {
              const box=boxes[match.id];
              if (!box || box.status!=="finished" || !box.players?.length || !box.teamComparison?.home || !box.teamComparison?.away)
                throw new Error("Final LAB sin boxscore completo: "+match.id);
              if (Number(match.homeScore)!==Number(box.homeScore) || Number(match.awayScore)!==Number(box.awayScore))
                throw new Error("Marcador y boxscore no coinciden: "+match.id);
            }
            if (!Array.isArray(fixture.teams) || fixture.teams.length<30 || !rosters.teams)
              throw new Error("Fixture o planteles LAB incompletos.");
            console.log("LAB validada:",fixture.matches.length,"partidos;",finals.length,"finales con boxscore;",Object.keys(rosters.teams).length,"equipos.");
          '

      - name: Detectar cambios para publicar
        if: steps.window.outputs.run == 'true'
        id: data
        run: |
          if git diff --quiet -- data/lab/labSchedule.json data/lab/labBoxscores.json data/lab/labRosters.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Compilar y probar LNA
        if: steps.data.outputs.changed == 'true'
        run: npm run build

      - name: Publicar resultados y estadísticas en main
        if: steps.data.outputs.changed == 'true'
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/lab/labSchedule.json data/lab/labBoxscores.json data/lab/labRosters.json
          git commit -m "Actualizar resultados y estadísticas oficiales LAB"
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main

      - name: Resumen de sincronización
        if: always()
        env:
          SYNC_MODE: ${{ steps.window.outputs.mode }}
          SYNC_RUN: ${{ steps.window.outputs.run }}
          SYNC_RESULT: ${{ job.status }}
        run: |
          {
            echo "## Sincronización oficial LAB"
            echo ""
            echo "- Modo: ${SYNC_MODE:-no determinado}"
            echo "- Partidos pendientes: ${SYNC_RUN:-no evaluado}"
            echo "- Estado: ${SYNC_RESULT}"
            echo "- Commit de partida: ${GITHUB_SHA}"
          } >> "$GITHUB_STEP_SUMMARY"
