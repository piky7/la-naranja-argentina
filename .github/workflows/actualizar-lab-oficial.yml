name: Actualizar resultados y estadísticas oficiales LAB

on:
  schedule:
    # Consulta frecuente para incorporar boxscores cuando finalizan los partidos.
    - cron: "*/10 * * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "data/lab/labSchedule.json"
      - ".github/workflows/actualizar-lab-oficial.yml"

permissions:
  contents: write

concurrency:
  group: actualizar-lab-oficial
  cancel-in-progress: false

jobs:
  actualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Actualizar resultados desde el fixture oficial LAB
        run: |
          git show HEAD:data/lab/labSchedule.json > /tmp/labSchedule.before.json
          node scripts/sync-lab-fixture.cjs
          node --input-type=module -e '
            import fs from "node:fs";
            const before=JSON.parse(fs.readFileSync("/tmp/labSchedule.before.json","utf8"));
            const after=JSON.parse(fs.readFileSync("data/lab/labSchedule.json","utf8"));
            const unchanged=JSON.stringify(before.teams)===JSON.stringify(after.teams) &&
              JSON.stringify(before.matches)===JSON.stringify(after.matches);
            if (unchanged) fs.copyFileSync("/tmp/labSchedule.before.json","data/lab/labSchedule.json");
            console.log(unchanged ? "Fixture sin cambios deportivos." : "Fixture actualizado con cambios oficiales.");
          '

      - name: Importar boxscores oficiales de partidos finalizados
        run: node scripts/sync-lab-boxscores.cjs --all-finished

      - name: Consolidar planteles solo si llegaron nuevas planillas
        id: data
        run: |
          if git diff --quiet -- data/lab/labBoxscores.json; then
            echo "boxscores_changed=false" >> "$GITHUB_OUTPUT"
            echo "No hay boxscores nuevos para consolidar."
          else
            node scripts/build-lab-rosters.cjs
            echo "boxscores_changed=true" >> "$GITHUB_OUTPUT"
          fi
          if git diff --quiet -- data/lab/labSchedule.json data/lab/labBoxscores.json data/lab/labRosters.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No hay cambios deportivos para publicar."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Validar datos consolidados
        if: steps.data.outputs.boxscores_changed == 'true'
        run: |
          node -e "const b=require('./data/lab/labBoxscores.json'); const r=require('./data/lab/labRosters.json'); const f=require('./data/lab/labSchedule.json'); if (!f.matches.length || !r.teams) process.exit(1); console.log('Fixture:',f.matches.length,'Boxscores:',Object.keys(b).length,'Equipos:',Object.keys(r.teams).length)"

      - name: Publicar resultados y estadísticas en main
        if: steps.data.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/lab/labSchedule.json data/lab/labBoxscores.json data/lab/labRosters.json
          git commit -m "Actualizar resultados y estadísticas oficiales LAB"
          git push origin HEAD:main

      - name: Resumen de actualización
        if: always()
        run: |
          {
            echo "## Actualización automática LAB"
            echo ""
            echo "- Datos deportivos nuevos: ${{ steps.data.outputs.changed || 'no determinado' }}"
            echo "- Estado: ${{ job.status }}"
            echo "- Commit de partida: ${{ github.sha }}"
          } >> "$GITHUB_STEP_SUMMARY"
