name: Actualizar LAB desde la Liga Nacional

on:
  schedule:
    # Mismo esquema que LNB: polling rápido y sincronizaciones completas espaciadas.
    - cron: "*/10 * * * *"
    - cron: "0 */6 * * *"
    - cron: "30 6 * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "Modo de sincronización"
        required: false
        type: choice
        options:
          - recent
          - full
        default: full
  push:
    branches: [main]
    paths:
      - ".github/workflows/actualizar-lab-oficial.yml"
      - "scripts/lab-poll-window.cjs"
      - "scripts/sync-lab-boxscores.cjs"
      - "scripts/sync-lab-fixture.cjs"

permissions:
  contents: write

concurrency:
  group: actualizar-lab-oficial-${{ github.ref }}
  cancel-in-progress: false

jobs:
  actualizar:
    runs-on: ubuntu-latest
    timeout-minutes: ${{ ((github.event_name == 'schedule' && github.event.schedule == '*/10 * * * *') || (github.event_name == 'workflow_dispatch' && inputs.mode == 'recent')) && 12 || 30 }}
    env:
      LAB_SCHEDULE: ${{ github.event.schedule }}
      LAB_REQUESTED_MODE: ${{ inputs.mode }}

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Comprobar partidos pendientes antes de instalar dependencias
        id: window
        run: node scripts/lab-poll-window.cjs

      - name: Configurar Node.js
        if: steps.window.outputs.run == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependencias
        if: steps.window.outputs.run == 'true'
        run: npm ci

      - name: Actualizar fixture oficial de LAB
        if: steps.window.outputs.run == 'true'
        run: node scripts/sync-lab-fixture.cjs

      - name: Importar boxscores oficiales pendientes
        if: steps.window.outputs.run == 'true'
        env:
          LAB_SYNC_MODE: ${{ steps.window.outputs.mode }}
        run: |
          if [ "$LAB_SYNC_MODE" = "recent" ]; then
            node scripts/sync-lab-boxscores.cjs --all-finished --recent
          else
            node scripts/sync-lab-boxscores.cjs --all-finished
          fi

      - name: Consolidar planteles si llegaron nuevas planillas
        if: steps.window.outputs.run == 'true'
        id: data
        run: |
          if git diff --quiet -- data/lab/labBoxscores.json; then
            echo "boxscores_changed=false" >> "$GITHUB_OUTPUT"
          else
            node scripts/build-lab-rosters.cjs
            echo "boxscores_changed=true" >> "$GITHUB_OUTPUT"
          fi
          if git diff --quiet -- data/lab/labSchedule.json data/lab/labBoxscores.json data/lab/labRosters.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Validar datos consolidados
        if: steps.data.outputs.boxscores_changed == 'true'
        run: |
          node -e "const b=require('./data/lab/labBoxscores.json'); const r=require('./data/lab/labRosters.json'); const f=require('./data/lab/labSchedule.json'); if (!f.matches.length || !r.teams) process.exit(1); console.log('Fixture:',f.matches.length,'Boxscores:',Object.keys(b).length,'Equipos:',Object.keys(r.teams).length)"

      - name: Publicar resultados y estadísticas en main
        if: steps.data.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/lab/labSchedule.json data/lab/labBoxscores.json data/lab/labRosters.json
          git commit -m "Actualizar resultados y estadísticas oficiales LAB"
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main

      - name: Resumen de sincronización
        if: always()
        env:
          SYNC_MODE: ${{ steps.window.outputs.mode }}
          SYNC_RUN: ${{ steps.window.outputs.run }}
          SYNC_RESULT: ${{ job.status }}
        run: |
          {
            echo "## Sincronización oficial LAB"
            echo ""
            echo "- Modo: ${SYNC_MODE:-no determinado}"
            echo "- Partidos pendientes: ${SYNC_RUN:-no evaluado}"
            echo "- Estado: ${SYNC_RESULT}"
            echo "- Commit de partida: ${GITHUB_SHA}"
          } >> "$GITHUB_STEP_SUMMARY"
