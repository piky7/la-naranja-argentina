name: Prueba segura LNB
on:
  workflow_dispatch:
  push:
    branches:
      - test/lnb-safe-update
    paths:
      - .github/workflows/prueba-segura-lnb.yml
      - scripts/test-safe-lnb.cjs
permissions:
  contents: read
jobs:
  prueba-aislada:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Ejecutar pruebas con archivos temporales
        run: node scripts/test-safe-lnb.cjs
      - name: Verificar que el repositorio no cambió
        run: git diff --exit-code
