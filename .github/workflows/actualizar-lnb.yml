
name: Actualizar LNB automáticamente

on:
  schedule:
    - cron: "*/15 * * * *"

  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: actualizar-lnb
  cancel-in-progress: false

jobs:
  actualizar-lnb:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Actualizar datos de LNB
        id: actualizar
        continue-on-error: true
        run: node auto-update-lnb.cjs

      - name: Guardar cambios
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add \
            src/data/matches.js \
            src/data/matchResults.js \
            src/data/matchStats.js \
            src/data/players.js \
            src/data/broadcasts.js \
            lnb-events.json

          if git diff --cached --quiet; then
            echo "No hay cambios para guardar."
          else
            git commit -m "Actualización automática LNB"
            git -c rebase.autoStash=true pull --rebase origin main
            git push origin HEAD:main
          fi

      - name: Informar errores de actualización
        if: steps.actualizar.outcome == 'failure'
        run: |
          echo "::warning::Uno o más partidos no pudieron procesarse."
          echo "Las actualizaciones correctas se guardaron si estaban disponibles."
