name: Publicar API de votaciones

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "workers/votaciones/**"
      - "tests/career-rules-regression.test.mjs"
      - "tests/career-db-performance.test.mjs"
      - "tests/prode-ranking-medals.test.mjs"
      - "workers/prode/worker.js"
      - "database/votaciones/**"
      - ".github/workflows/deploy-votaciones.yml"

permissions:
  contents: read

concurrency:
  group: deploy-lna-votaciones
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Verificar sintaxis y reglas deportivas de Mi Carrera y Prode
        run: |
          node --check workers/votaciones/worker.js
          node --check workers/prode/worker.js
          node --test tests/career-rules-regression.test.mjs tests/prode-ranking-medals.test.mjs tests/career-db-performance.test.mjs

      - name: Comprobar credenciales
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::Falta CLOUDFLARE_API_TOKEN o CLOUDFLARE_ACCOUNT_ID en Secrets."
            exit 1
          fi

      - name: Aplicar migración de tablas operativas de votaciones
        run: npx --yes wrangler@4 d1 execute lna-votaciones --remote --config workers/votaciones/wrangler.toml --file database/votaciones/002_runtime_tables.sql
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Aplicar índices de lectura de votaciones
        run: npx --yes wrangler@4 d1 execute lna-votaciones --remote --config workers/votaciones/wrangler.toml --file database/votaciones/003_read_indexes.sql
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Publicar solamente lna-votaciones-api
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: workers/votaciones
          command: deploy --config wrangler.toml
          wranglerVersion: "4.47.0"
