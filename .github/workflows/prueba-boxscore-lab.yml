name: Probar estructura oficial de Liga Argentina

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  inspeccionar-boxscore-lab:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4
      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Instalar dependencias
        run: npm ci
      - name: Validar fixture oficial LAB
        run: |
          node scripts/probe-lab-fixture.cjs
          node scripts/parse-fixture-lab.cjs --summary
      - name: Inspeccionar pestaña Estadísticas del box score oficial
        run: node scripts/probe-lab-boxscore.cjs
      - name: Importar todos los box scores oficiales pendientes
        run: node scripts/sync-lab-boxscores.cjs --all-finished --refresh-comparison
      - name: Consolidar planteles y estadísticas por equipo
        run: node scripts/build-lab-rosters.cjs
      - name: Guardar box scores y planteles consolidados
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add data/lab/labBoxscores.json data/lab/labRosters.json
          git diff --cached --quiet || git commit -m 'Importar box scores históricos oficiales LAB'
          git pull --rebase origin main
          git push
