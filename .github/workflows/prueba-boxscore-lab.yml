name: Probar estructura oficial de Liga Argentina

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/prueba-boxscore-lab.yml"
      - "scripts/probe-lab-fixture.cjs"
      - "scripts/probe-lab-boxscore.cjs"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspeccionar-boxscore-lab:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4
      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Instalar dependencias
        run: npm ci
      - name: Validar fixture oficial LAB
        run: |
          node scripts/probe-lab-fixture.cjs
          node scripts/parse-fixture-lab.cjs --summary
      - name: Inspeccionar pestaña Estadísticas del box score oficial
        run: node scripts/probe-lab-boxscore.cjs
