name: Validar Liga y popups
on:
  push:
    branches: [main]
    paths:
      - "src/pages/Liga.jsx"
      - "src/pages/Home.jsx"
      - "src/pages/Estadisticas.jsx"
      - "src/pages/Equipo.jsx"
      - "eslint.config.js"
      - "src/components/LiveMatchInfo.jsx"
      - "src/components/CategoryBalance.jsx"
      - "src/components/TripleRankings.jsx"
      - "src/components/TeamRankings.jsx"
      - "src/components/MatchVote.jsx"
      - "scripts/verify-liga-popups.mjs"
      - "scripts/verify-liga-collective.mjs"
      - ".github/workflows/validar-liga.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Detectar variables no definidas en Liga, Home, Estadísticas y Equipo
        run: npx eslint src/pages/Liga.jsx src/pages/Home.jsx src/pages/Estadisticas.jsx src/pages/Equipo.jsx --rule "no-undef:error" --rule "no-constant-condition:off" --rule "no-unused-vars:off" --rule "react-hooks/exhaustive-deps:off" --rule "react-hooks/set-state-in-effect:off" --rule "react-hooks/immutability:off" --rule "react-hooks/purity:off" --rule "react-hooks/refs:off" --rule "react-hooks/static-components:off" --rule "react-hooks/preserve-manual-memoization:off" --rule "react-refresh/only-export-components:off"
      - name: Validar referencias del popup de Liga
        run: node scripts/verify-liga-popups.mjs
      - name: Comparar promedios y rankings colectivos originales y optimizados
        run: node scripts/verify-liga-collective.mjs
      - name: Compilar LNA
        run: npm run build
