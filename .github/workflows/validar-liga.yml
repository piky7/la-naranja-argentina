name: Validar Liga y popups
on:
  push:
    branches: [main]
    paths:
      - "src/pages/Liga.jsx"
      - "src/pages/Home.jsx"
      - "src/pages/Home.css"
      - "tests/upcoming-popup-footer.test.mjs"
      - "tests/finished-popup-footer.test.mjs"
      - "tests/home-font-render.test.mjs"
      - "tests/home-first-render.test.mjs"
      - "src/components/Header.jsx"
      - "index.html"
      - "scripts/optimize-logo.mjs"
      - "scripts/optimize-team-logos.mjs"
      - "src/data/teams.js"
      - "tests/team-logo-webp.test.mjs"
      - "scripts/optimize-legacy-logo.mjs"
      - "scripts/preload-home-logos.mjs"
      - "tests/home-lcp-preload.test.mjs"
      - "tests/home-image-performance.test.mjs"
      - "package.json"
      - "package-lock.json"
      - "src/pages/Estadisticas.jsx"
      - "src/pages/Estadisticas.css"
      - "src/pages/Equipos.jsx"
      - "src/pages/Equipos.css"
      - "src/pages/Equipo.jsx"
      - "src/utils/getMatchStats.js"
      - "src/utils/indexFinishedLiveMatches.js"
      - "tests/render-optimization.test.mjs"
      - "tests/match-stats-shared.test.mjs"
      - "src/App.jsx"
      - "src/main.jsx"
      - "tests/lazy-secondary-routes.test.mjs"
      - "src/hooks/useLiveMatch.js"
      - "src/hooks/useLiveSnapshot.js"
      - "tests/live-shared.test.mjs"
      - "src/pages/Prode.jsx"
      - "src/pages/Prode.css"
      - "src/components/ProdeCrest.jsx"
      - "src/components/ProdeSportsShield.jsx"
      - "src/components/sportsCrestDesign.js"
      - "src/components/ProdeGoogleAccess.jsx"
      - "src/components/FanLevel.jsx"
      - "src/components/FanLevel.css"
      - "src/components/CareerEntryNotices.jsx"
      - "src/components/CareerEntryNotices.css"
      - "tests/career-entry-notices.test.mjs"
      - "src/components/CareerProfileAccess.jsx"
      - "src/components/CareerProfileAccess.css"
      - "src/pages/Perfil.jsx"
      - "src/pages/Perfil.css"
      - "src/auth/prodeProfile.js"
      - "tests/prode-sports-crest.test.mjs"
      - "src/components/ProdeGroups.jsx"
      - "src/components/ProdeHistoricalRanking.jsx"
      - "vite.config.js"
      - "scripts/verify-stats-chunk.cjs"
      - "eslint.config.js"
      - "src/components/LiveMatchInfo.jsx"
      - "src/components/CategoryBalance.jsx"
      - "src/components/TripleRankings.jsx"
      - "src/components/TeamRankings.jsx"
      - "src/components/MatchVote.jsx"
      - "src/components/MatchStatsTabs.jsx"
      - "src/components/FinishedMatchModal.jsx"
      - "src/components/UpcomingMatchModal.jsx"
      - "src/components/UpcomingHeader.css"
      - "src/components/PopupDeferredOverrides.css"
      - "tests/upcoming-popup-shared.test.mjs"
      - "src/components/MatchStatsTabs.css"
      - "scripts/verify-liga-popups.mjs"
      - "scripts/verify-liga-collective.mjs"
      - ".github/workflows/validar-liga.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Detectar variables no definidas en Liga, Home, Estadísticas y Equipo
        run: npx eslint src/pages/Liga.jsx src/pages/Home.jsx src/pages/Estadisticas.jsx src/pages/Equipos.jsx src/pages/Equipo.jsx src/App.jsx src/components/MatchStatsTabs.jsx src/components/FinishedMatchModal.jsx src/components/CareerEntryNotices.jsx --rule "no-undef:error" --rule "no-constant-condition:off" --rule "no-unused-vars:off" --rule "react-hooks/exhaustive-deps:off" --rule "react-hooks/set-state-in-effect:off" --rule "react-hooks/immutability:off" --rule "react-hooks/purity:off" --rule "react-hooks/refs:off" --rule "react-hooks/static-components:off" --rule "react-hooks/preserve-manual-memoization:off" --rule "react-refresh/only-export-components:off"
      - name: Validar referencias del popup de Liga
        run: node scripts/verify-liga-popups.mjs
      - name: Validar avisos globales de Mi Carrera
        run: node --test tests/career-entry-notices.test.mjs
      - name: Comparar promedios y rankings colectivos originales y optimizados
        run: node scripts/verify-liga-collective.mjs
      - name: Compilar LNA
        run: npm run build
      - name: Verificar separación de estadísticas oficiales
        run: node scripts/verify-stats-chunk.cjs
      - name: Verificar precarga LCP del primer partido
        run: |
          grep -q "data-lna-home-crest-preload" dist/index.html
          echo "Precarga LCP disponible en HTML"
      - name: Verificar escudos WebP optimizados
        run: |
          test "$(find src/assets/teams-webp -name '*.webp' | wc -l)" -eq 18
          # Vite incluye WebP muy pequeños como data URI en el JavaScript,
          # por lo que no todos aparecen como archivos separados en dist.
          test "$(find dist/assets -name '*.webp' | wc -l)" -ge 1
          echo "18 escudos WebP generados; los pequeños pueden quedar inlineados por Vite"
      - name: Verificar reducción del logo en producción
        run: |
          test -s public/logo-lna.webp
          test -s dist/logo-lna.webp
          test $(wc -c < dist/logo-lna.png) -lt 180000
          echo "Logo PNG heredado: $(wc -c < dist/logo-lna.png) bytes"
          test -s dist/favicon-lna-64.png
          echo "Favicon optimizado: $(wc -c < dist/favicon-lna-64.png) bytes"
          echo "Logo WebP generado: $(wc -c < dist/logo-lna.webp) bytes"

