name: Actualizar LNB desde la Liga Nacional

on:
  schedule:
    # 03:30 en Argentina; permite que terminen los partidos nocturnos.
    - cron: "30 6 * * *"
  workflow_dispatch:
  push:
    branches:
      - feature/reemplazo-oficial-lnb
    paths:
      - ".github/workflows/actualizar-lnb-oficial.yml"
      - "sync-official-stats-preview.cjs"
      - "publish-official-stats.cjs"
      - "sync-liga-history.cjs"
      - "extractor-liga.cjs"

permissions:
  contents: write

concurrency:
  group: actualizar-lnb-oficial
  cancel-in-progress: false

jobs:
  actualizar-oficial:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Consultar fixture oficial de la Liga Nacional
        run: node discover-liga.cjs

      - name: Incorporar partidos oficiales nuevos
        run: node merge-liga-events.cjs

      - name: Regenerar calendario oficial de LNA
        run: node generate-official-schedule.cjs

      - name: Extraer estadísticas desde las páginas oficiales
        run: node sync-liga-history.cjs

      - name: Validar resultados y estadísticas oficiales
        run: node sync-official-stats-preview.cjs

      - name: Preparar archivos de la web con datos oficiales validados
        run: node publish-official-stats.cjs

      - name: Compilar la web
        run: npm run build

      - name: Publicar actualización únicamente desde main
        if: github.ref == 'refs/heads/main'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add             liga-events.json             liga-history.json             src/data/officialSchedule.js             src/data/matchStats.js             src/data/matchResults.js             public/published-matches.json

          if git diff --cached --quiet; then
            echo "No hay cambios oficiales nuevos para publicar."
          else
            git commit -m "Actualizar resultados y estadísticas oficiales LNB"
            git -c rebase.autoStash=true pull --rebase origin main
            git push origin HEAD:main
          fi

      - name: Guardar vista previa y diagnóstico
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lna-datos-oficiales
          path: |
            official-sync-preview.json
            liga-history.json
            liga-events-preview.json
          if-no-files-found: ignore
          retention-days: 7
