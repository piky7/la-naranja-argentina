name: Probar historial de estadísticas oficiales LNA

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/prueba-historial-oficial.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probar-historial:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      # Esta modificación ocurre solo en el runner temporal de Actions.
      # Retiramos tres partidos del historial para forzar una reextracción real.
      - name: Preparar tres partidos históricos para volver a extraer
        run: |
          node --input-type=module -e '
          import fs from "node:fs";
          const historyPath = "liga-history.json";
          const fixturePath = "liga-events.json";
          const targets = [
            "https://www.laliganacional.com.ar/laliga/partido/v2kxKmD-zO6hYv1dnwEnZPcrVUQ920f68VEGsE0kMlWVfdSg6wMtD1-A==/lanus-vs-gimnasia-cr",
            "https://www.laliganacional.com.ar/laliga/partido/v2RzrtxkxttV1HrT9AByAlS3T5Wo8LPxLJ4r6yO9bT7VYNIK06re0FnQ==/penarol-mdp-vs-gimnasia-cr",
            "https://www.laliganacional.com.ar/laliga/partido/v22kWqnCuyvPwoV-8fPOlP0m6CBVczJUAPAa4jXBiOhEhjfVpDvlywoQ==/argentino-j-vs-ferro"
          ];
          if (!fs.existsSync(historyPath)) throw new Error("No existe liga-history.json");
          const history = JSON.parse(fs.readFileSync(historyPath, "utf8"));
          const fixture = JSON.parse(fs.readFileSync(fixturePath, "utf8"));
          if (!Array.isArray(history.matches) || !Array.isArray(fixture.matches)) throw new Error("Estructura de historial o fixture inválida");
          for (const url of targets) {
            if (!fixture.matches.some(match => match.officialUrl === url)) throw new Error("El partido de prueba no está en liga-events.json: " + url);
            if (!history.matches.some(match => match.officialUrl === url)) throw new Error("El partido no estaba en el historial inicial; no se puede probar una reextracción controlada: " + url);
          }
          const before = history.matches.length;
          history.matches = history.matches.filter(match => !targets.includes(match.officialUrl));
          fs.writeFileSync(historyPath, JSON.stringify(history, null, 2) + "\n");
          console.log("Partidos en historial antes de la prueba:", before);
          console.log("Partidos retirados solo en el runner temporal:", targets.length);
          console.log("Partidos en historial antes de reextraer:", history.matches.length);
          '

      - name: Extraer nuevamente los tres partidos históricos
        run: node sync-liga-history.cjs

      - name: Validar marcador y puntos individuales de los tres partidos
        run: |
          node --input-type=module -e '
          import fs from "node:fs";
          const history = JSON.parse(fs.readFileSync("liga-history.json", "utf8"));
          const fixture = JSON.parse(fs.readFileSync("liga-events.json", "utf8"));
          const targets = [
            "https://www.laliganacional.com.ar/laliga/partido/v2kxKmD-zO6hYv1dnwEnZPcrVUQ920f68VEGsE0kMlWVfdSg6wMtD1-A==/lanus-vs-gimnasia-cr",
            "https://www.laliganacional.com.ar/laliga/partido/v2RzrtxkxttV1HrT9AByAlS3T5Wo8LPxLJ4r6yO9bT7VYNIK06re0FnQ==/penarol-mdp-vs-gimnasia-cr",
            "https://www.laliganacional.com.ar/laliga/partido/v22kWqnCuyvPwoV-8fPOlP0m6CBVczJUAPAa4jXBiOhEhjfVpDvlywoQ==/argentino-j-vs-ferro"
          ];
          for (const url of targets) {
            const expected = fixture.matches.find(match => match.officialUrl === url);
            const found = history.matches.filter(match => match.officialUrl === url);
            if (found.length !== 1) throw new Error("Se esperaba exactamente un registro reextraído para " + url + "; encontrados: " + found.length);
            const match = found[0];
            if (match.homeScore !== expected.homeScore || match.awayScore !== expected.awayScore) throw new Error("El marcador extraído no coincide con el fixture oficial: " + url);
            for (const teamExpected of [
              { data: expected.home, score: expected.homeScore },
              { data: expected.away, score: expected.awayScore }
            ]) {
              const team = match.teams?.find(item => item.officialTeamId === teamExpected.data.officialTeamId);
              if (!team) throw new Error("Falta un equipo oficial en " + url);
              if (!Array.isArray(team.players) || team.players.length === 0) throw new Error("No hay jugadores para " + team.data?.name);
              const points = team.players.reduce((sum, player) => sum + Number(player.points || 0), 0);
              console.log(expected.date + " | " + teamExpected.data.name + ": " + team.players.length + " jugadores; puntos " + points + "/" + teamExpected.score);
              if (points !== teamExpected.score) throw new Error("La suma de puntos individuales no coincide para " + teamExpected.data.name + " en " + url);
            }
            console.log("Partido validado:", expected.home.name, expected.homeScore, "-", expected.awayScore, expected.away.name);
          }
          console.log("PRUEBA MULTIPARTIDO SUPERADA: los tres partidos se reextrajeron, sin duplicados, y los puntos individuales coinciden.");
          console.log("Total de partidos en el historial temporal:", history.matches.length);
          '

      - name: Publicar artefactos de diagnóstico
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: historial-oficial-lna-prueba-multipartido
          path: |
            liga-history.json
            liga-match-temp.json
          if-no-files-found: ignore
          retention-days: 7
