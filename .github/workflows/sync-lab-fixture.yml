name: Sincronizar fixture Liga Argentina

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-lab-fixture
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Importar fixture oficial LAB
        run: node scripts/sync-lab-fixture.cjs
      - name: Validar JSON generado
        run: |
          node -e "const d=require('./data/lab/labSchedule.json'); if (!d.total || d.total !== d.matches.length || !d.teams.length) process.exit(1); console.log('LAB:', d.total, 'partidos;', d.teams.length, 'equipos')"
      - name: Guardar actualización
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/lab/labSchedule.json
          if git diff --cached --quiet; then
            echo "El fixture LAB no tuvo cambios."
          else
            git commit -m "chore(lab): actualizar fixture oficial"
            git push
          fi
