name: Probar reemplazo oficial de estadísticas LNA

on:
  push:
    branches:
      - feature/reemplazo-oficial-lnb
    paths:
      - ".github/workflows/prueba-reemplazo-oficial.yml"
      - "sync-official-stats-preview.cjs"
      - "extractor-liga.cjs"
      - "liga-events.json"
      - "liga-history.json"
      - "src/data/players.js"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: prueba-reemplazo-oficial-lna
  cancel-in-progress: false

jobs:
  validar-fuente-oficial:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Comprobar archivos oficiales requeridos
        run: |
          test -s liga-events.json
          test -s liga-history.json
          test -s src/data/players.js
          node --input-type=module -e '
          import fs from "node:fs";
          const fixture = JSON.parse(fs.readFileSync("liga-events.json", "utf8"));
          const history = JSON.parse(fs.readFileSync("liga-history.json", "utf8"));
          if (fixture.source !== "Liga Nacional") throw new Error("Fixture no identificado como fuente oficial.");
          if (!Array.isArray(fixture.matches) || fixture.matches.length === 0) throw new Error("Fixture oficial vacío.");
          if (history.source !== "Liga Nacional" || !Array.isArray(history.matches) || history.matches.length === 0) throw new Error("Historial oficial vacío o fuente incorrecta.");
          console.log("Fixture oficial:", fixture.matches.length, "partidos");
          console.log("Historial oficial:", history.matches.length, "partidos");
          '

      - name: Validar y generar vista previa sin tocar producción
        run: node sync-official-stats-preview.cjs

      - name: Verificar que la salida declare la fuente oficial y tenga datos
        run: |
          node --input-type=module -e '
          import fs from "node:fs";
          const data = JSON.parse(fs.readFileSync("official-sync-preview.json", "utf8"));
          if (data.source !== "Liga Nacional") throw new Error("La salida no declara la fuente oficial.");
          if (!Number.isInteger(data.verifiedMatches) || data.verifiedMatches < 1) throw new Error("No hay partidos oficiales verificados.");
          if (Object.keys(data.matchStats || {}).length !== data.verifiedMatches) throw new Error("El número de estadísticas no coincide con el total validado.");
          if (Object.keys(data.matchResults || {}).length < data.verifiedMatches) throw new Error("Hay menos resultados oficiales que partidos con estadísticas validadas.");
          console.log("Partidos verificados:", data.verifiedMatches);
          console.log("Partidos omitidos:", data.skippedMatches);
          console.log("Todos los partidos publicados en la vista previa proceden del historial oficial y pasaron las validaciones.");
          '

      - name: Guardar vista previa y reporte como artefactos de diagnóstico
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vista-previa-reemplazo-oficial-lna
          path: |
            official-sync-preview.json
            liga-history.json
          if-no-files-found: ignore
          retention-days: 7
